name: Release

# Triggered by pushing a version tag (e.g. `v1.0.0`). Builds the Windows
# installer + portable, and publishes them — together with `latest.yml`
# (SHA-512 checksums used by the in-app auto-updater) — to a GitHub Release,
# using electron-builder's own publisher (target configured in
# steam-manager/electron-builder.yml). The tag should match package.json's
# version (tag `v1.0.0` <-> version `1.0.0`).

on:
  push:
    tags:
      - 'v*'

defaults:
  run:
    working-directory: steam-manager

jobs:
  release:
    name: Build and Release
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: steam-manager/package-lock.json
      - run: npm ci
      - run: npm test
      - name: Build and publish to GitHub Releases
        run: npm run build -- --publish always
        env:
          # Scoped to this repository; electron-builder uses it to create the
          # release and upload artifacts + latest.yml.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
